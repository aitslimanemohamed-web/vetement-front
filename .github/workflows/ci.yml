name: CI

# Vérifications automatiques avant déploiement. Le déploiement lui-même est géré
# nativement par Vercel (intégration Git sur push vers main), pas par ce workflow
# — voir docs/CONTEXTE_PROJET.md (dépôt vetement-back) pour l'adresse déployée.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances (à partir du fichier de verrouillage)
        run: npm ci --legacy-peer-deps

      - name: Vérifier les types
        run: npm run type-check

      - name: Vérifier le code (lint)
        run: npm run lint

      - name: Exécuter les tests
        run: npm test

      - name: Construire l'application
        run: npm run build
